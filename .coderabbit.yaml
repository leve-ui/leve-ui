# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    ignore_title_keywords:
      - "chore(release)"
      - "chore(docs): update translations"
  path_filters:
    - "!**/dist/**"
    - "!**/storybook-static/**"
    - "!**/.turbo/**"
    - "!**/pnpm-lock.yaml"
    - "!apps/docs/i18n/*.json"
    - "!apps/docs/styled-system/**"
  path_instructions:
    - path: "packages/components/**"
      instructions: |
        Enforce leve-ui component architecture and WAI-ARIA / APG rules:
        - Accessibility: Prefer native HTML elements (`<button type="button">`, `<a>`, etc.) over `div` + `role`. Required `role` and `aria-*` attributes must be output by the library AFTER `{...props}` so user props cannot accidentally override them. ID associations must use `useId()` (allowing user-supplied `id` to take precedence). Implement all APG keyboard interactions and focus management (use `moveRovingFocus` from `@leve-ui/utils` with `sync$` / `preventdefault:keydown` for roving tabindex). Never use positive `tabIndex` or embed `outline: none`. Decorative icons must have `aria-hidden="true"`.
        - Headless & parts: 1 DOM element = 1 part = 1 file (`<name>-<part>.tsx`), exported as namespace (`export * as <Name> from './<name>'`). Do not output `class`, `style`, or bundle CSS (only minimal functional inline styles with explanatory comments are allowed). Output `data-leve-<name>-<part>` (`data-leve-<name>` on Root), `data-state`, and `dataAttr()` from `@leve-ui/utils` for boolean data attributes.
        - Props & state: Spread `{...props}` on the rendered element. Compose event handlers as arrays (`onClick$={[internalHandler$, props.onClick$]}`). Use `useControllableState` for controlled (`bind:<state>`) / uncontrolled (`default<State>`) state and `useFieldControl` for form controls.
        - Qwik SSR safety: No `Math.random()`. Avoid `useVisibleTask$` unless strictly required (must have a comment and `biome-ignore`). Never derive parent attributes from child-determined state.
        - Testing: Components must have unit tests in `src/<name>.test.tsx` verifying `data-leve-*`, `role`, `aria-*`, `data-state`, arbitrary props forwarding, and controlled/uncontrolled behavior.
    - path: "packages/core/**"
      instructions: |
        `@leve-ui/core` must only re-export components and types from `@leve-ui/*` packages. Flag any component implementation or business logic placed directly in `packages/core`.
    - path: "packages/utils/**"
      instructions: |
        Shared utilities used by 2+ components belong here. New functions must have unit tests (`<file>.test.ts`). Do not introduce dependencies on component packages.
    - path: "packages/**"
      instructions: |
        - Package changes should include an English changeset in `.changeset/`.
        - `package.json` must list `@leve-ui/source` (`./src/index.ts`) first in `exports`, have `"license": "MIT"`, and include a matching `LICENSE` file in the package directory.
        - Shared Vite config (`defineLibraryConfig` from `@leve-ui/vite-config`) must be used without custom per-package build overrides.
    - path: "apps/storybook/stories/**"
      instructions: |
        Follow leve-ui Storybook rules:
        - Each story must render a standalone `export default component$` demo in `stories/demos/<name>/<story>.tsx` with a co-located `<story>.css` loaded via `?inline` and `useStyles$`.
        - Story files must import TSX and CSS via `?raw` and pass them through `demoSource()` to `parameters.docs.source.code`. Never put inline JSX directly in `render` or hide styles/parts in helper components or external constants.
        - CSS class names must start with `<component>-<story>`. Comments (including CSS comments) must be in English. Colors must use `light-dark()` per the Demo style guide. Only `@qwikest/icons/lucide` (with `aria-hidden="true"`) is allowed as an external package in demos.
        - Never add E2E-only focus guard elements to demos (use `gotoStory(..., { focusGuards: true })` in E2E tests).
    - path: "apps/e2e/tests/**"
      instructions: |
        E2E tests (Playwright) must verify APG keyboard interactions (1 test case per interaction) and focus movement/restoration. External URLs/images must be mocked with `page.route`.
    - path: "apps/docs/**"
      instructions: |
        Follow leve-ui docs site rules:
        - UI components that can be built with leve-ui must use `@leve-ui/core` or `@leve-ui/<name>` public APIs (never `@leve-ui/utils` or internal `src`). Temporary native fallbacks must be minimal and marked `// TODO(leve-ui): replace with <Name>`.
        - Pages must be written in English under `src/routes/(en)/` only. UI strings must use `t(locale, '...')` (or `msg('...')` for static definitions) with string literals; never return `t` as a function from a hook.
        - Use CSS logical properties (`ms`, `me`, `ps`, `pe`, `borderInlineStart`, `textAlign: 'start'`) for RTL readiness.
    - path: "adr/**"
      instructions: |
        ADRs must be written in English. Accepted ADRs must not have their body rewritten; supersede them with a new ADR instead.
    - path: ".changeset/**"
      instructions: |
        Changeset summaries must be written in English. Until 1.0, `major` must NOT be used (use `minor` for breaking changes).

chat:
  auto_reply: true

name: CI

on:
  pull_request:
  push:
    branches: [main]
  # The Release workflow dispatches CI on the release PR branch, because PRs
  # created with GITHUB_TOKEN do not trigger workflows (adr/0019).
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # git フックは CI では不要
  LEFTHOOK: 0
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: filter
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
          echo "Changed files:"
          echo "$changed"

          if echo "$changed" | grep -qE '^(packages/|apps/storybook/|apps/e2e/|tooling/|\.github/workflows/ci\.yml|\.github/actions/setup/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|turbo\.json$|\.node-version$)'; then
            echo "e2e=true" >> "$GITHUB_OUTPUT"
          else
            echo "e2e=false" >> "$GITHUB_OUTPUT"
          fi

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Lint commits in the pull request
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - name: Lint pull request title (used as the squash commit message)
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint --verbose
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm exec biome ci .

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # typecheck and test depend on ^build (turbo.json), so all three jobs build the
      # same packages. Persist the Turborepo local cache per job so unchanged tasks
      # are replayed instead of rebuilt. Keys are per job to avoid save races.
      - name: Restore Turborepo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm typecheck
      # Restored caches keep growing; drop entries not rewritten for a week.
      - name: Prune old Turborepo cache entries
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true
      - name: Save Turborepo cache
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}

  test:
    name: Unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # typecheck and test depend on ^build (turbo.json), so all three jobs build the
      # same packages. Persist the Turborepo local cache per job so unchanged tasks
      # are replayed instead of rebuilt. Keys are per job to avoid save races.
      - name: Restore Turborepo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm test
      # Restored caches keep growing; drop entries not rewritten for a week.
      - name: Prune old Turborepo cache entries
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true
      - name: Save Turborepo cache
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # typecheck and test depend on ^build (turbo.json), so all three jobs build the
      # same packages. Persist the Turborepo local cache per job so unchanged tasks
      # are replayed instead of rebuilt. Keys are per job to avoid save races.
      - name: Restore Turborepo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.job }}-
      - run: pnpm build
      # Restored caches keep growing; drop entries not rewritten for a week.
      - name: Prune old Turborepo cache entries
        run: find .turbo/cache -type f -mtime +7 -delete 2>/dev/null || true
      - name: Save Turborepo cache
        uses: actions/cache/save@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}

  publish-readiness:
    name: Publish readiness
    # Only on the release PR. Skipped jobs count as passing for required checks.
    if: github.head_ref == 'changeset-release/main' || github.ref_name == 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Check that all public packages exist on npm
        run: pnpm package:check-npm

  e2e:
    # One job per browser engine, run in parallel
    name: E2E (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium
            label: Chromium
          - project: webkit
            label: WebKit
          - project: firefox
            label: Firefox
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # Tests run against the static Storybook build: the dev server compiles each story on
      # its first visit, which made the first test of many spec files time out (#161).
      # Reuse the Build job's Turborepo cache from earlier runs (restore only).
      - name: Restore Turborepo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-build-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-build-
      - name: Build Storybook
        run: pnpm turbo run build --filter=@leve-ui/storybook...
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./apps/e2e/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @leve-ui/e2e exec playwright install --with-deps ${{ matrix.project }}
      - name: Save Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.project }}-${{ steps.playwright-version.outputs.version }}
      - name: Install Playwright OS dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @leve-ui/e2e exec playwright install-deps ${{ matrix.project }}
      - run: pnpm e2e -- --project=${{ matrix.project }}
        env:
          E2E_STATIC: 1
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
          retention-days: 7

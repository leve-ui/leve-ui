name: Docs deploy

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Only run when something that affects the docs build changes.
    # The preview is not a required check (adr/0027, adr/0034), so skipped runs never block merging.
    paths:
      - "packages/**"
      - "apps/docs/**"
      - "apps/storybook/stories/demos/**"
      - "tooling/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".node-version"
      - ".github/actions/setup/**"
      - ".github/workflows/docs-deploy.yml"
  # Called by release.yml after packages are published to update production docs (adr/0039).
  workflow_call:
  # Allows a maintainer to deploy production docs manually (e.g. for docs-only or translation updates).
  workflow_dispatch:

permissions:
  contents: read

env:
  LEFTHOOK: 0
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  deploy:
    name: Deploy docs
    # Skip pull requests from forks because repository secrets are unavailable
    # to them and pull_request_target must not be used (see adr/0027, adr/0034).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # Cancel any older in-progress preview for the same PR; keep production deploys ordered without canceling.
    concurrency:
      group: docs-deploy-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      deployments: write
    env:
      DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
      DEPLOY_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build docs
        # Static site generation (apps/docs/adapters/static). Packages are resolved from src via
        # the @leve-ui/source condition, so they do not need to be built first.
        run: pnpm --filter @leve-ui/docs build
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # wrangler is a devDependency of @leve-ui/docs; without it the action runs pnpm add at the workspace root, which fails.
          workingDirectory: apps/docs
          command: pages deploy dist --project-name=leve-ui-docs --branch=${{ env.DEPLOY_BRANCH }} --commit-hash=${{ env.DEPLOY_SHA }} --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Comment on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v8
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          COMMIT_SHA: ${{ env.DEPLOY_SHA }}
        with:
          script: |
            const marker = '<!-- docs-preview -->';
            const shortSha = (process.env.COMMIT_SHA || '').slice(0, 7);
            const deploymentUrl = (process.env.DEPLOYMENT_URL || '').trim();
            const aliasUrl = (process.env.ALIAS_URL || '').trim();

            let body = `${marker}\n### Docs preview\n\n| | URL |\n| --- | --- |\n| This commit (\`${shortSha}\`) | ${deploymentUrl} |`;
            if (aliasUrl) {
              body += `\n| Branch alias (latest) | ${aliasUrl} |`;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.body && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Write step summary
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          ALIAS_URL: ${{ steps.deploy.outputs.pages-deployment-alias-url }}
          COMMIT_SHA: ${{ env.DEPLOY_SHA }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          {
            if [ "${{ github.event_name }}" = "pull_request" ]; then
              echo "### Docs preview"
            else
              echo "### Docs deploy"
            fi
            echo ""
            echo "| | URL |"
            echo "| --- | --- |"
            echo "| This commit (\`$SHORT_SHA\`) | $DEPLOYMENT_URL |"
            if [ -n "$ALIAS_URL" ]; then
              echo "| Branch alias (latest) | $ALIAS_URL |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

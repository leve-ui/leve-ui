name: Gemini PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ (github.event_name == 'issue_comment' && !(github.event.issue.pull_request != null && github.event.issue.state == 'open' && contains(github.event.comment.body, '/review') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))) && format('skip-{0}', github.run_id) || format('gemini-review-{0}', github.event.pull_request.number || github.event.issue.number) }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Review PR
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft &&
        !startsWith(github.event.pull_request.title, 'chore(release)') &&
        !startsWith(github.event.pull_request.title, 'chore(docs): update translations')
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.issue.state == 'open' &&
        contains(github.event.comment.body, '/review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check review eligibility and GEMINI_API_KEY
        id: guard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "run_review=false" >> "$GITHUB_OUTPUT"
            echo "Skipping review: secrets.GEMINI_API_KEY is not configured."
            exit 0
          fi

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            is_cross_repo=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json isCrossRepository --jq .isCrossRepository)
            if [ "$is_cross_repo" = "true" ]; then
              echo "run_review=false" >> "$GITHUB_OUTPUT"
              echo "Skipping review: fork PRs are excluded from credentialed review for security."
              exit 0
            fi
          fi

          echo "run_review=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.guard.outputs.run_review == 'true'
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        if: steps.guard.outputs.run_review == 'true'
        with:
          node-version-file: .node-version

      - name: Run Gemini PR Review
        if: steps.guard.outputs.run_review == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.8-flash
          GEMINI_THINKING_LEVEL: medium
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          OUTPUT_FILE: /tmp/gemini-review.md
        run: node .github/scripts/gemini-review.mjs

      - name: Post Review Comment
        if: steps.guard.outputs.run_review == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: gh pr comment "$PR_NUMBER" --repo "${{ github.repository }}" --body-file /tmp/gemini-review.md

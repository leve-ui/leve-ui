name: Gemini PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ (github.event_name == 'issue_comment' && !(github.event.issue.pull_request != null && github.event.issue.state == 'open' && contains(github.event.comment.body, '/review') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))) && format('skip-{0}', github.run_id) || format('gemini-review-{0}', github.event.pull_request.number || github.event.issue.number) }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    name: Review PR
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        !github.event.pull_request.draft &&
        !startsWith(github.event.pull_request.title, 'chore(release)') &&
        github.event.pull_request.title != 'chore(docs): update translations'
      ) || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        github.event.issue.state == 'open' &&
        contains(github.event.comment.body, '/review') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check review eligibility and GEMINI_API_KEY
        id: guard
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "run_review=false" >> "$GITHUB_OUTPUT"
            echo "Skipping review: secrets.GEMINI_API_KEY is not configured."
            exit 0
          fi

          if [ "$EVENT_NAME" = "issue_comment" ]; then
            is_cross_repo=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json isCrossRepository --jq .isCrossRepository)
            if [ "$is_cross_repo" = "true" ]; then
              echo "run_review=false" >> "$GITHUB_OUTPUT"
              echo "Skipping review: fork PRs are excluded from credentialed review for security."
              exit 0
            fi
          fi

          echo "run_review=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.guard.outputs.run_review == 'true'
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/head', github.event.issue.number) || '' }}
          persist-credentials: false

      - name: Prepare PR context
        if: steps.guard.outputs.run_review == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          {
            echo "# Pull Request #$PR_NUMBER"
            echo ""
            gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json title,body,files --template '## Title
          {{.title}}

          ## Body
          {{.body}}

          ## Changed Files
          {{range .files}}- {{.path}} (+{{.additions}}/-{{.deletions}})
          {{end}}'
            echo ""
            echo "## Diff"
            echo '```diff'
            gh pr diff "$PR_NUMBER" --repo "${{ github.repository }}"
            echo '```'
          } > .gemini-review-context.md

      - name: Run Gemini PR Review
        id: review
        if: steps.guard.outputs.run_review == 'true'
        uses: google-github-actions/run-gemini-cli@v0
        env:
          GEMINI_CLI_TRUST_WORKSPACE: "true"
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          gemini_model: gemini-3.8-flash
          prompt: |
            You are an assertive, thorough code reviewer for `leve-ui` (a Headless UI library for Qwik).
            Review Pull Request #${{ github.event.pull_request.number || github.event.issue.number }} in English.

            To keep the review fast and focused:
            1. Read `.gemini-review-context.md` and `AGENTS.md` first.
            2. Only read the relevant files in `.agents/rules/` for the modified paths (e.g., `accessibility.md`, `component-architecture.md`, `testing.md` for `packages/components/**`; `storybook.md` for `apps/storybook/**`; `docs-site.md` for `apps/docs/**`; `git-commit.md` for changesets/commits).
            3. Inspect surrounding workspace files only when needed to verify types, utilities (`@leve-ui/utils`), or ADRs (`adr/`). Ignore generated files (`pnpm-lock.yaml`, `apps/docs/i18n/*.json`, `dist/`, `storybook-static/`).
            4. Focus on:
               - Bugs, edge cases, and Qwik SSR/hydration pitfalls (`useId()`, avoiding `Math.random()`, `useVisibleTask$` justification, parent/child state ordering)
               - WAI-ARIA / APG compliance (native elements, required `role`/`aria-*` after `{...props}`, keyboard navigation, focus management)
               - Headless architecture (1 DOM element = 1 part, `data-leve-*` / `data-state`, no bundled CSS/styles, `useControllableState`, `useFieldControl`)
               - Missing unit tests, Storybook demos, E2E tests, or English changesets (note: never use `major` before 1.0)
               - PR title format (English Conventional Commits)
            5. Output your complete, structured markdown review directly in your final response (include file paths, line references, severity, and concrete suggestions; if everything looks good, clearly state that no actionable issues were found). Do not run `gh` commands or write files.

      - name: Post Review Comment
        if: steps.guard.outputs.run_review == 'true' && steps.review.outputs.summary != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number }}
          REVIEW_SUMMARY: ${{ steps.review.outputs.summary }}
        run: |
          printf '%s\n' "$REVIEW_SUMMARY" > /tmp/gemini-review.md
          gh pr comment "$PR_NUMBER" --body-file /tmp/gemini-review.md
